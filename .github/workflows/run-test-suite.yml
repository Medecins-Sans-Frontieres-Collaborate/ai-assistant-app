name: Run Unit Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24.22.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # The documents layer's sandbox programs (lib/services/documents/model)
      # are tested by running them; the sandbox has lxml, fontTools and
      # PyMuPDF (fitz), so the tests do too.
      - name: Install Python packages for the sandbox script tests
        run: apt-get update && apt-get install -y --no-install-recommends python3-lxml python3-fonttools python3-fitz

      - name: Run Vitest Suite
        run: npm test
